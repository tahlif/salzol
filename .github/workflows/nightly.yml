name: nightly-prices

on:
  schedule:
    # דקות "עקומות" מחוץ לעומס - גיטהאב משמיט ריצות בדקות עגולות בשעות צפופות.
    # שתי ריצות = ביטוח: אם הראשונה נשמטת השנייה מכסה; אם שתיהן רצות - השנייה
    # פשוט לא תמצא שינויים (ההיסטוריה שומרת שינויים-בלבד, ריצה כפולה לא מזיקה).
    - cron: '17 4 * * *'   # 07:17 שעון ישראל בקיץ
    - cron: '47 5 * * *'   # 08:47 - ריצת גיבוי
  workflow_dispatch: {}     # הרצה ידנית מה-UI של גיטהאב

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: משיכת קבצי המחירים
        run: node pipeline/fetch.js

      - name: גיאוקוד סניפים חדשים (אינקרמנטלי)
        run: node pipeline/geocode.js

      - name: דיוק Google לסניפים חדשים (דורש secret בשם GOOGLE_MAPS_KEY)
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: node pipeline/geocode-google.js

      - name: הצמדה לנקודות סופרמרקטים ב-OSM
        run: node pipeline/osm-pois.js

      - name: דו"ח אימות מיקומים
        run: node pipeline/verify-geo.js

      - name: בנייה ועדכון שינויים
        run: node pipeline/build.js

      - name: מפת תמונות מצטברת (Open Facts + רמי לוי, נתח לילי)
        run: node pipeline/images.js

      - name: פוסט יומי אוטומטי לפייסבוק
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node pipeline/social-post.js

      - name: מענה אוטומטי לתגובות בעמוד
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node pipeline/social-replies.js

      - name: קומיט של הדאטה המעודכן
        run: |
          git config user.name "zolli-bot"
          git config user.email "actions@github.com"
          git add site/data pipeline/geo.json pipeline/branches.json pipeline/osm-pois.json \
                  pipeline/city-geo.json pipeline/city-geo-google.json pipeline/top200.json pipeline/geo-report.txt
          git diff --cached --quiet || git commit -m "עדכון מחירים יומי $(date +%d.%m.%Y)"
          # חסינות מפני push מקביל; בקונפליקט בקבצים גנרטיביים -X theirs משאיר את
          # הדאטה שנבנה כאן עכשיו (ברי-בייס theirs = הקומיט המקומי המוחזר)
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: פריסה ל-Cloudflare (push מתוך Action לא מפעיל workflow אחר - לכן פורסים כאן)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
