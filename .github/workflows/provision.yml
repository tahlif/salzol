name: provision
# חד-פעמי: יצירת KV namespace למשתמשים - ה-id מהלוג נכנס ל-wrangler.jsonc
on:
  workflow_dispatch: {}
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: יצירת KV למשתמשים
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv namespace create USERS || true
